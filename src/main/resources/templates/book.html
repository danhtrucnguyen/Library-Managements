<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">

<head>
	<meta charset="UTF-8">
	<title>Book</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
			integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
			crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
	<section>
		<div class="container-fluid mt-1">
			<div class="row">
				<div class="col-md-2 p-0">
					<div class="card shadow-sm p-0 mb-5 bg-body-tertiary rounded">
						<div class="card-body">
							<div class="list-group">
								<p class="fs-5">Danh mục</p>
								<a href="/books" th:classappend="${paramValue==''} ? 'active':''"
									class="list-group-item list-group-item-action" aria-current="true"> Tất cả sách
								</a> <a th:each="c:${categories}" th:href="@{'/books?category='+${c.name}}"
									th:classappend="${paramValue == c.name} ? 'active':''"
									class="list-group-item list-group-item-action">[[${c.name}]]</a>
							</div>
						</div>
					</div>
					<div class="card shadow-sm p-0 mb-5 bg-body-tertiary rounded">
						<div class="card-body">
							<div class="list-group">
								<p class="fs-5">Nhà xuất bản</p>
								<a href="/books" th:classappend="${paramValue==''} ? 'active':''"
									class="list-group-item list-group-item-action" aria-current="true"> Tất cả sách
								</a> <a th:each="pu:${publishers}" th:href="@{'/books?publisher='+${pu.name}}"
									th:classappend="${paramValue == pu.name} ? 'active':''"
									class="list-group-item list-group-item-action">[[${pu.name}]]</a>
							</div>
						</div>
					</div>
				</div>

				<div class="col-md-10">
					<div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body">
							<p class="fs-3 text-center">Sách</p>
							<div class="row" th:text="${message}">
								<th:block th:if="${books.size >0}">
									<div class="swiper-slide" th:each="p:${books}" style="width: 300px; ">
										<div class="card position-relative p-4 border rounded-3" >
											<div class="position-absolute">
												<!--<p class="bg-primary py-1 px-3 fs-6 text-white rounded-2">10% off</p>-->
											</div>
											<img th:src="@{'/images/book_img/'+${p.image}}" class="img-fluid shadow-sm"
												alt="book item">
											<h6 class="mt-4 mb-0 fw-bold"><a href="index.html">[[${p.bookName}]]</a>
											</h6>
											<div class="review-content d-flex">
												<p class="my-2 me-2 fs-6 text-black-50">[[${p.author}]]</p>

												<div class="rating text-warning d-flex align-items-center">
													<svg class="star star-fill">
														<use xlink:href="#star-fill"></use>
													</svg>
													<svg class="star star-fill">
														<use xlink:href="#star-fill"></use>
													</svg>
													<svg class="star star-fill">
														<use xlink:href="#star-fill"></use>
													</svg>
													<svg class="star star-fill">
														<use xlink:href="#star-fill"></use>
													</svg>
													<svg class="star star-fill">
														<use xlink:href="#star-fill"></use>
													</svg>
												</div>
											</div>
											<span class="price text-primary fw-bold mb-2 fs-5">[[${p.stock}]]</span>
											<div class="card-concern position-absolute start-0 end-0 d-flex gap-2">
												<button type="button" href="#" class="btn btn-dark"
													data-bs-toggle="tooltip" data-bs-placement="top"
													data-bs-title="Tooltip on top">
													<svg class="cart">
														<use xlink:href="#cart"></use>
													</svg>
												</button>
												<a href="#" class="btn btn-dark">
													<span>
														<svg class="wishlist">
															<use xlink:href="#heart"></use>
														</svg>
													</span>
												</a>
											</div>
											<a th:href="@{'/book/'+${p.id}}"
												class="btn btn-primary col-md-6 offset-md-3">View
												Books</a>
										</div>
									</div>
								</th:block>
								<th:block th:unless="${books.size>0}">
									<p class="fs-4 text-center mt-4 text-danger">Sách không tồn tại</p>
								</th:block>
							</div>
						</div>
					</div>

				</div>
			</div>
		</div>
	</section>
</body>
</html>
