<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tạo bài đăng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://cdn.ckeditor.com/4.21.0/standard/ckeditor.js"></script>
</head>
<body>
<div class="container mt-5">
    <h1>Tạo bài đăng</h1>
    <form id="blogPostForm">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" class="form-control" name="title" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Content</label>
            <textarea id="content" class="form-control" name="pcontent" required></textarea>
        </div>
        <button type="button" id="submitBtn" class="btn btn-success">Submit</button>
        <a href="/admin/admin_blog_list" class="btn btn-secondary">Back to List</a>
    </form>
</div>

<script>
    document.getElementById('submitBtn').addEventListener('click', async () => {
        const form = document.getElementById('blogPostForm');
        const formData = new FormData(form);

        // Chuyển đổi FormData thành JSON
        const json = {};
        formData.forEach((value, key) => {
            json[key] = value;
        });

        try {
            const response = await fetch('/admin/add_blog_post', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(json),
            });

            if (response.ok) {
                const result = await response.json();
                alert('Bài đăng đã được tạo thành công!');
                window.location.href = '/admin/admin_blog_list'; // Chuyển hướng sau khi thành công
            } else {
                const error = await response.text();
                alert('Đã xảy ra lỗi: ' + error);
            }
        } catch (err) {
            alert('Đã xảy ra lỗi khi gửi yêu cầu: ' + err.message);
        }
    });
</script>
</body>
</html>
